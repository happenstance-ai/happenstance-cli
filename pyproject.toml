[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "happenstance"
version = "0.2.3"
description = "Happenstance CLI — search your network with AI for sales, hiring, fundraising, and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Happenstance", email = "support@happenstance.ai" },
]
keywords = ["happenstance", "cli", "network", "search", "people"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://happenstance.ai"
Documentation = "https://developer.happenstance.ai"

[tool.hatch.build.targets.wheel]
packages = ["hpn_cli"]

[project.scripts]
hpn = "hpn_cli.cli:main"
happenstance = "hpn_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
    "responses>=0.25.0",
]
